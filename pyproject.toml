[project]
name = "quietroom"
version = "0.3.0"
description = "Receive-only HackRF TSCM bug-sweep tool"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "flask>=3.0",
    "flask-socketio>=5.4",
    "simple-websocket>=1.0",
]

[project.optional-dependencies]
# Speaker/mic access for the audio-correlation test (needs PortAudio).
audio = ["sounddevice>=0.4"]
# Kept for existing `uv sync --extra dev` workflows; prefer the dev group.
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
quietroom = "quietroom.cli:main"
quietroom-web = "quietroom.web.app:main"
quietroom-node = "quietroom.node.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quietroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set; import sorting/style can be tightened later.
select = ["E", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["quietroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
