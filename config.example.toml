# Copy to /etc/quietroom/config.toml and edit. Frequencies: Hz ints or "300M"/"2.4G"/"100k".
# Loading is strict: an unknown key, a wrong type or an out-of-range value stops the
# node at start-up with every problem listed. Check edits with:
#   quietroom-node --config /etc/quietroom/config.toml --check-config
[node]
id = "floor3-east"
site = "hq"
floor = "3"
room = "east offices"
region = "us"
threshold_k = 4.0
baseline_cycles = 5
poll_s = 1.0
shutdown_flush_s = 30.0   # final flush of all outboxes on SIGTERM; (0, 45], fits TimeoutStopSec=60
antenna = "ANT500"        # label only; changing it invalidates stored baselines

[[segments]]
name = "covert-uhf"
start_hz = 300_000_000
stop_hz = 470_000_000
bin_hz = 25_000
interval_s = 60
priority = 10

[[segments]]
name = "wifi24"
mode = "overview"
start = "2.4G"
stop = "2.4835G"
bin = "100k"
interval_s = 300
priority = 5

[[segments]]
name = "overview"
mode = "overview"
start = "88M"
stop = "6G"
bin = "1M"
interval_s = 3600
priority = 1

# Re-baseline policy. Learning is frozen while a segment has an alert-grade
# finding (score >= freeze_score) within incident_hold_s; a recapture whose own
# sweeps show an alert-grade emitter is discarded. Each new baseline is a new
# Store version recording why it was captured. Omit the section to reuse the
# stored baseline indefinitely (only front-end changes trigger a recapture).
[baseline]
max_age_s = 604800        # 7 days; 0 = never age out
drift_window = 10         # quiet live sweeps per drift check; 0 = off
drift_mean_db = 3.0       # recapture if mean |delta| >= this ...
drift_changed_fraction = 0.10  # ... or this fraction of bins moved > 6 dB
incident_hold_s = 3600    # keep learning frozen this long after the last hit
# freeze_score = 80       # defaults to [alerts].min_score
invalidate_on_fingerprint = true  # plan / gains / radio serial / antenna changed
# Every refresh is also checked against the segment's long-lived *anchor*
# baseline, so slow creep cannot be learned a few dB at a time. Operator
# commands (--rebaseline [--force], --ack, --promote-anchor): see
# packaging/baseline-operations.md.

[store]
path = "/var/lib/quietroom/quietroom.db"

[alerts]
min_score = 80
cooldown_s = 3600
webhook_url = ""          # set to enable webhook alerts (secret via QUIETROOM_WEBHOOK_SECRET)
max_attempts = 5          # after this many failures an alert stops blocking its channel
max_age_s = 604800        # park alerts undelivered this long (7 days); 0 = never
flush_budget_s = 15.0     # per channel per tick: no new send after this many s; (0, 30]
# Parked alerts: quietroom-node --outbox list|requeue (packaging/hardening.md)

# Email alerts. Remove/comment this table to disable. The SMTP password comes
# only from QUIETROOM_SMTP_PASSWORD (e.g. /etc/quietroom/secrets.env); a
# `password` key here is rejected. Undelivered alerts queue in
# <store path>.alerts-outbox and retry with backoff (30 s doubling to 1 h).
# [alerts.email]
# host = "smtp.example.com"
# port = 587               # 465 with ssl = true
# starttls = true          # required, not opportunistic; cert verified
# ssl = false              # implicit TLS (SMTPS) instead of STARTTLS
# from = "quietroom@example.com"
# to = ["secops@example.com"]
# username = "quietroom"   # AUTH only over TLS; omit for an open local relay
# ca_file = ""             # private relay CA (PEM); default system trust store
# timeout_s = 10

[fleet]
base_url = ""             # set (https://...) to enable central upload
heartbeat_s = 60
# Per-node mTLS (default auth); see packaging/fleet-mtls.md for issuing certs.
# auth = "mtls"           # or "legacy-token" (DEPRECATED shared QUIETROOM_CENTRAL_TOKEN)
# cert_file = "/etc/quietroom/fleet/node.crt"       # SAN urn:uuid:<this node's UUID>
# key_file = "/etc/quietroom/fleet/node.key"        # mode 0600
# ca_file = "/etc/quietroom/fleet/central-ca.crt"   # pins central's server CA
# identity_path = "/var/lib/quietroom/identity.json"  # default: next to [store] path
# cert_warn_days = 30     # warn in health/heartbeat this long before node.crt expires
# Local queue of uploads central has not accepted yet (heartbeats coalesce to the newest).
# Bounded so a node cut off from central cannot fill its disk: past outbox_max_rows the
# oldest rows are parked, and past that many parked rows the oldest parked are deleted
# (counted in health as fleet_outbox.dropped). Parked rows:
#   quietroom-node --outbox list --channel fleet --parked
#   quietroom-node --outbox requeue --channel fleet --id N
# outbox_max_rows = 20000   # >= 1; this bound cannot be disabled
# outbox_max_age_s = 604800 # park uploads undelivered this long (7 days); 0 = never
# outbox_max_attempts = 5   # failures before a row stops blocking the queue; 0 = never
# flush_budget_s = 15.0     # per tick: no new upload after this many s; (0, 30]
